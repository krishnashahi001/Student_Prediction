<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <base href="/sppa/">
    <link rel="stylesheet" href="Design/style.css">
</head>
<body>
    <nav>
        <div class="nav-left">
           <button onclick="navigateTo('Templates/Index.html')"> 
                <img src="components/icons/home.png" class="icon"> Home </button>
        </div>
    </nav>
    <main>
        <h2>Admin Login</h2>
        <form id="adminLoginForm" action="backend/admin_login.php" method="POST" autocomplete="off">
            <input name="username" type="text" placeholder="Username" required>
            <input name="password" type="password" placeholder="Password" required>
            <button type="submit">Login</button>
        </form>
         <p> Login as <a href="backend/login-page.php"><img src="components/icons/student.png" class="icon">Student</a> <p>
        <div id="errorMessage" style="color:#b00;margin-top:10px"></div>
    </main>

    <script src="javascript/script.js"></script>
    <script>
        // Show error message when redirected with ?error=1
        const params = new URLSearchParams(window.location.search);
        if (params.get('error') === '1') {
            document.getElementById('errorMessage').textContent = 'Invalid admin credentials.';
        }
    </script>
</body>
</html>
