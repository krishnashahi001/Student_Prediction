<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Performance Prediction</title>
    <base href="/sppa/">
    <link rel="stylesheet" href="Design/style.css">
</head>
<body>
    <nav>
        <div class="nav-left">
          <button onclick="navigateTo('backend/user-profile.php')"> 
                <img src="components/icons/profile.png" class="icon"> Profile </button>
        </div>
        <div class="nav-right">
            <button onclick="navigateTo('Templates/Index.html')"> <img src="components/icons/signout.png" class="icon">Sign out</button>
        </div>
    </nav>
    
    <main>
        <h2> Performance Prediction</h2>
        <b>Enter data to predict Your Performance</b>
        <br>    
        <br>    
        <form id="predictionForm">
           <label> Enter Past Score % : </label>
           <input type="number" id="last-marks" placeholder="0.0" step="0.1" required>
           <label> Enter Assignment Submitted in Last-Semester : </label>
           <input type="number" id="last-assignment" placeholder="0" required>
           <label> Enter Percentage of Attendence in Last-Semester :  </label>
           <input type="number" id="last-attendence" placeholder="0.0 " step="0.1" required>
           <label> Enter Current Semester Attendence Percentage : </label>
           <input type="number" id="current-attendence" placeholder="0.0 " step="0.1" required>
           <label> Enter Current Assignments Submitted : </label>
           <input type="number" id="current-assignment" placeholder="0" required>
           <label> Weekly Study Hours (optional): </label>
           <input type="number" id="study-hours" placeholder="0" step="0.1">
           <label> Previous GPA (optional, e.g., 0-10 or 0-4): </label>
           <input type="number" id="previous-gpa" placeholder="0" step="0.1">
           <label> Lab/Practical Score (0-100, optional): </label>
           <input type="number" id="lab-score" placeholder="0" step="0.1" min="0" max="100">
          <button type="button" onclick="submitPrediction()"><img src="components/icons/analyse.png" class="icon" >Analysis </button>
        </form>
       </main>
    <script src="javascript/script.js"></script>
    <script>
        function submitPrediction() {
            const lastMarks = document.getElementById('last-marks').value;
            const lastAssignment = document.getElementById('last-assignment').value;
            const lastAttendence = document.getElementById('last-attendence').value;
            const currentAttendence = document.getElementById('current-attendence').value;
            const currentAssignment = document.getElementById('current-assignment').value;
            const studyHours = document.getElementById('study-hours').value;
            const previousGPA = document.getElementById('previous-gpa').value;

            const params = new URLSearchParams();
            params.append('lastMarks', lastMarks);
            params.append('lastAssignment', lastAssignment);
            params.append('lastAttendence', lastAttendence);
            params.append('currentAttendence', currentAttendence);
            params.append('currentAssignment', currentAssignment);
            params.append('studyHoursPerWeek', studyHours);
            params.append('previousGPA', previousGPA);

            window.location.href = `Templates/prediction.html?${params.toString()}`;
        }
    </script>
</body>
</html>
