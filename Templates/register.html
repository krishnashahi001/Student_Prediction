<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <base href="/sppa/">
    <link rel="stylesheet" href="Design/style.css">
</head>
<body>
    <nav>
         <div class="nav-left">
            <button onclick="navigateTo('Templates/Index.html')"> 
                <img src="components/icons/home.png" class="icon"> Home </button>

        </div>
        <div class="nav-right">
            <button onclick="navigateTo('Templates/register.html')">
                <img src="components/icons/register.png" class="icon">Register</button>
            <button onclick="navigateTo('backend/login-page.php')">
                <img src="components/icons/login.png" class="icon">Login</button>

        </div>
    </nav>
    
    <main>
        <h2>Register</h2>
        <form id="registerForm" action="backend/store.php" method="POST" autocomplete="off">
            <input id="roll" name="roll" type="text" placeholder="Roll Number" required pattern="[0-9A-Za-z-]+" maxlength="20" title="Enter your roll number as provided" autocomplete="off">
            <input id="fullname" name="fullname" type="text" placeholder="Full Name" required >
            <input id="email" name="email" type="email" placeholder="Email" required >
            <!-- contact input pre‑filled with +91; user enters remaining 10 digits starting 6‑9 -->
            <input id="contact" name="contact" type="text" placeholder="+91XXXXXXXXXX" value="+91" pattern="^\+91[6-9][0-9]{9}$" maxlength="13" required autocomplete="off">
            <div id="contactError" class="form-error" role="alert" aria-live="polite">Enter the correct number</div>
            <input id="password" name="password" type="password" placeholder="Password" required>
            <input id="confirm_password" name="confirm_password" type="password" placeholder="Confirm Password" required >
            <!-- inline password error message -->
            <div id="passwordError" class="form-error" role="alert" aria-live="polite"></div>
            <label for="stream"> Choose Stream:</label>
            <select id="stream" name="stream" required>
                <option value="" >Select your stream</option>
                <option value="bsc_it">Bsc.IT</option>
                <option value="bsc_cs">Bsc.CS</option>
                <option value="bcom">B.Com</option>
                <option value="bms">BMS</option>
            </select>
            <button type="submit" >Register</button>
        </form>
        <!-- small prompt under the form to navigate to login -->
        <div class="form-footer">
            <p>Already have an account? <a href="backend/login-page.php">Login</a></p>
        </div>
    </main>
    
    <script src="javascript/script.js"></script>
</body>
</html>
